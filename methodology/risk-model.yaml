# Методика предварительной оценки риска (score 0–100).
#
# Итог = Σ(вес × баллы уровня) / Σ(вес), затем «полы» — минимальный итог при условиях,
# которые закон или стандарт FATF прямо относят к высокому риску. Правила определения
# уровня каждого фактора — в src/ipdl/analysis/risk.py и docs/METHODOLOGY.md.
# Любое изменение весов/порогов — новая версия `id`: она сохраняется в каждом портрете.
id: ipdl-risk-2026.10
title: "Предварительная оценка риска ИПДЛ, версия 2026.10"

bands:            # границы уровней итогового score (включительно)
  low: [0, 33]
  medium: [34, 66]
  high: [67, 100]

points:           # баллы фактора по уровню
  low: 10
  medium: 55
  high: 100
# Нет данных — не «низкий риск»: фактор считается близким к среднему
no_data_points: 40

review_months:    # срок следующего пересмотра по итоговому уровню
  low: 24
  medium: 12
  high: 6

factors:
  position:
    weight: 0.20
    title: "Должность и уровень влияния"
  jurisdiction:
    weight: 0.15
    title: "Юрисдикция / страна"
  wealth:
    weight: 0.10
    title: "Источники благосостояния"
  sanctions:
    weight: 0.20
    title: "Санкционные списки"
  legal:
    weight: 0.10
    title: "Уголовные дела и расследования"
  adverse_media:
    weight: 0.10
    title: "Негативные публикации в СМИ"
  related:
    weight: 0.10
    title: "Связанные лица и компании"
  transactions:
    weight: 0.05
    title: "Финансовые операции в РК"

floors:
  sanctions_match:
    min_score: 85
    reason: "Возможное совпадение с официальным санкционным списком (ООН, OFAC, ЕС, Великобритания)"
  foreign_pep_current:
    min_score: 67
    reason: >-
      Действующее ИПДЛ / должностное лицо международной организации: п. 1 ст. 8 Закона РК
      № 191-IV требует усиленных мер надлежащей проверки на постоянной основе
  foreign_pep_former:
    min_score: 34
    reason: "Бывшее ИПДЛ: риск сохраняется, мера — по оценке риска (Рекомендация 12 FATF)"

# Нормы, на которые ссылаются выводы портрета. Тексты сверены с adilet.zan.kz 2026-10-27.
legal_basis:
  pep_definition:
    act: >-
      Закон Республики Казахстан от 28 августа 2009 года № 191-IV «О противодействии
      легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма
      и финансированию распространения оружия массового уничтожения»
    clause: "подпункт 3-3) статьи 1"
    url: "https://adilet.zan.kz/rus/docs/Z090000191_"
    foreign_state_body: >-
      абзац 6: «лицо, назначаемое или избираемое, занимающее какую-либо должность в
      законодательном, исполнительном, административном, судебном органах или вооруженных
      силах иностранного государства»
    foreign_public_function: "абзац 7: «лицо, выполняющее какую-либо публичную функцию для иностранного государства»"
    international_org: >-
      абзац 8: «лицо, занимающее руководящую должность в организациях, созданных
      государствами на основе соглашений, которые имеют статус международных договоров»
      (в редакции Закона РК от 12.06.2026 № 311-VIII)
    domestic: >-
      абзацы 2–5: лицо, занимающее ответственную государственную должность; должностное лицо;
      лицо, уполномоченное на выполнение государственных функций; лицо, исполняющее
      управленческие функции в государственной организации или субъекте квазигосударственного
      сектора
  pep_measures:
    clause: "пункт 1 статьи 8"
    measures:
      - "проверка принадлежности (причастности) клиента и бенефициарного собственника к ПДЛ, его супруге (супругу) и близким родственникам"
      - "оценка репутации ПДЛ в отношении причастности к ОД/ФТ/ФРОМУ"
      - "письменное разрешение руководящего работника на установление/продолжение деловых отношений"
      - "доступные меры для установления источника происхождения денег и иного имущества"
      - "усиленные меры надлежащей проверки на постоянной основе"
  domestic_list:
    clause: "пункты 2–4 статьи 8"
    note: >-
      Для ПДЛ Республики Казахстан меры пункта 1 применяются к лицам из перечня, утверждаемого
      Президентом РК, их супругам и близким родственникам с высоким уровнем риска; после
      прекращения полномочий — в течение двенадцати месяцев.
  fatf:
    clause: "Рекомендация 12 FATF «Публичные должностные лица»"
    url: "https://www.fatf-gafi.org/en/topics/fatf-recommendations.html"
