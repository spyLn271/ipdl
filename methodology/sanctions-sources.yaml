# Официальные санкционные списки, по которым идёт автоматический скрининг.
# Обновляются воркером ежедневно (sanctions.update_hour_utc) и командой `ipdl sanctions update`.
# Проверено 2026-10-27: все четыре адреса отдают XML с этого сервера.
#
# entry_url — ссылка на карточку записи для аналитика ({ref} — идентификатор в списке).
lists:
  - id: un
    name: "Сводный санкционный перечень Совета Безопасности ООН"
    short: "ООН"
    url: "https://scsanctions.un.org/resources/xml/en/consolidated.xml"
    format: un
    entry_url: "https://main.un.org/securitycouncil/en/content/un-sc-consolidated-list"

  - id: ofac_sdn
    name: "OFAC Specially Designated Nationals (Минфин США)"
    short: "OFAC"
    url: "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML"
    format: ofac_sdn
    entry_url: "https://sanctionssearch.ofac.treas.gov/Details.aspx?id={ref}"

  - id: eu
    name: "Сводный список финансовых санкций ЕС"
    short: "ЕС"
    # Публичный токен из документации EU Financial Sanctions Files (FSF)
    url: "https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw"
    format: eu_fsf
    entry_url: "https://www.sanctionsmap.eu/"

  - id: uk
    name: "UK Sanctions List (FCDO)"
    short: "Великобритания"
    url: "https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.xml"
    format: uk_fcdo
    entry_url: "https://search-uk-sanctions-list.service.gov.uk/"
