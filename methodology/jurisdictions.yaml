# Справочник юрисдикций для фактора «Юрисдикция / страна» и «Связанные компании».
# Коды — ISO 3166-1 alpha-2. Каждый перечень — с датой и источником; устаревший перечень
# (старше review_after_days) отмечается в портрете предупреждением.

fatf:
  as_of: 2026-06-19
  review_after_days: 130  # пленарные заседания FATF — февраль, июнь, октябрь
  source: >-
    FATF: «High-Risk Jurisdictions subject to a Call for Action» и «Jurisdictions under
    Increased Monitoring», 19 июня 2026 г. (пленарное заседание 17–19 июня 2026 г.).
    Перечень сверен с уведомлением Security Bureau Гонконга от 26.06.2026.
  source_url: "https://www.fatf-gafi.org/en/countries/black-and-grey-lists.html"
  # «Чёрный список»: призыв применять контрмеры / усиленную проверку
  call_for_action:
    KP: "контрмеры"
    IR: "контрмеры"
    MM: "усиленная надлежащая проверка"
  # «Серый список»: юрисдикции под усиленным мониторингом (22)
  increased_monitoring:
    - AO  # Ангола
    - BA  # Босния и Герцеговина (с июня 2026)
    - BO  # Боливия
    - BG  # Болгария
    - CM  # Камерун
    - CI  # Кот-д'Ивуар
    - CD  # ДР Конго
    - HT  # Гаити
    - IQ  # Ирак (с июня 2026)
    - KE  # Кения
    - KW  # Кувейт
    - LA  # Лаос
    - LB  # Ливан
    - MC  # Монако
    - NP  # Непал
    - PG  # Папуа — Новая Гвинея
    - SS  # Южный Судан
    - SY  # Сирия
    - VE  # Венесуэла
    - VN  # Вьетнам
    - VG  # Британские Виргинские острова
    - YE  # Йемен

preferential_tax:
  as_of: 2026-01-01
  source: >-
    Приказ Министра финансов Республики Казахстан от 12 сентября 2025 года № 492
    «Об утверждении перечня государств с льготным налогообложением» (рег. № 36853,
    вводится в действие с 01.01.2026), приложение 1.
  source_url: "https://adilet.zan.kz/rus/docs/V2500036853"
  # Государства целиком и территории, у которых есть собственный код ISO 3166-1
  codes: [
    AD, AG, BS, BB, BH, BZ, BN, VU, GY, GT, GD, DJ, DO, DM, CO, KM, CR, LR, LB, MU, MR, MV,
    MH, MC, MT, MM, NR, NG, PW, PA, WS, SM, SC, VC, KN, LC, SR, TZ, TO, TT, FJ, PH, ME, LK, JM,
    # территории: Аомынь, Сянган, Северные Марианские острова, Аруба и Антильские острова,
    # острова Кука и Ниуэ, британские территории, территории США и Франции
    MO, HK, MP, AW, CW, SX, BQ, CK, NU, AI, BM, VG, GI, KY, MS, TC, IM, GG, JE, GS, IO,
    VI, GU, PR, TF, PF, GF,
  ]
  # Льготный режим только для части территории — по стране целиком не отмечаем
  partial:
    ES: "Канарские острова"
    MY: "анклав Лабуан"
    PT: "острова Мадейра"
    MA: "город Танжер"
    US: "штат Вайоминг (и территории, перечисленные выше)"

# Дополнительный перечень организации (например, по внутренней оценке рисков).
# Пустой по умолчанию — заполняется ответственным за методику.
national_high_risk: {}
